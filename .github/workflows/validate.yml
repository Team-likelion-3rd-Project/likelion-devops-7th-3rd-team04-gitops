# PR 필수 status check (ruleset 에 "validate" 로 등록) — main 에 들어가는 모든 변경을 검증합니다.
name: validate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: validate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 비밀값 스캔이 PR 전체 이력을 봄

      - uses: azure/setup-helm@v4
        with:
          version: v3.22.0   # 모노레포 infra/ansible group_vars 의 helm_version 과 맞춤

      # 차트 고정 · 이미지 태그 형식 · helm template · kubeconform (로컬: ./scripts/validate.sh)
      - name: values 검증
        run: bash scripts/validate.sh

      # public 레포 — 비밀값이 커밋되면 PR 단계에서 막음 (이력에 남으면 지울 수 없음)
      - name: 비밀값 스캔 (gitleaks)
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.21.2 \
            detect --source /repo --redact --no-banner
