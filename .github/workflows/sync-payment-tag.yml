# 결제 서버 이미지 태그를 AWS Parameter Store 에 동기화합니다 (merge 후 — 사람이 승인한 main 만).
#
#   envs/prod/payment/values.yaml 의 image.imageTag → /team04-hotel/prod/image-tag/payment-service
#   결제 서버(결제 VPC)는 GitHub 로 나가지 않으므로 이 레포 대신 Parameter Store 를 보고 스스로 갱신합니다 (pull agent).
#
# AWS 자격 증명은 장기 키 대신 GitHub OIDC 로 받습니다. Role(모노레포 Terraform 10-global github-oidc.tf)은
# 이 레포의 main 브랜치 실행만 신뢰하고, 위 파라미터 하나만 쓸 수 있습니다.
#
# ⚠️ public 레포라 Actions 로그도 공개입니다. Role ARN(계정 ID 포함)은 변수가 아니라 Secret AWS_SSM_SYNC_ROLE_ARN 으로 넣어
#    로그에서 가리고, 계정 ID 마스킹도 켭니다.
name: sync-payment-tag

on:
  push:
    branches: [main]
    paths:
      - envs/prod/payment/values.yaml
  # 동기화 확인 · 재실행 (main 에서만 Role 을 받을 수 있음)
  workflow_dispatch:

permissions:
  id-token: write   # GitHub OIDC 토큰 발급
  contents: read

# 연속 merge 시 순서대로 (나중 값이 앞 값을 덮어씀)
concurrency:
  group: sync-payment-tag
  cancel-in-progress: false

jobs:
  sync:
    name: sync
    runs-on: ubuntu-24.04
    env:
      PARAMETER: /team04-hotel/prod/image-tag/payment-service
    steps:
      - uses: actions/checkout@v4

      - name: 태그 읽기
        id: tag
        run: |
          tag="$(yq '.image.imageTag' envs/prod/payment/values.yaml)"
          if [[ "$tag" =~ ^0+$ ]]; then
            echo "placeholder=true" >> "$GITHUB_OUTPUT"
            echo "::notice::결제 서버 태그가 자리표시($tag)라 Parameter Store 는 바꾸지 않습니다 (Role · 읽기 권한만 확인)"
          elif [[ "$tag" =~ ^[0-9a-f]{7,40}$ ]]; then
            echo "placeholder=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::image.imageTag 는 커밋 SHA 여야 합니다: $tag"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: AWS 자격 증명 (GitHub OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_SSM_SYNC_ROLE_ARN }}
          aws-region: us-east-1
          mask-aws-account-id: true
          role-session-name: gitops-sync-payment-tag-${{ github.run_id }}

      - name: Parameter Store 갱신
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          PLACEHOLDER: ${{ steps.tag.outputs.placeholder }}
        run: |
          current="$(aws ssm get-parameter --name "$PARAMETER" --query Parameter.Value --output text)"
          echo "현재 값: $current"
          if [[ "$PLACEHOLDER" == "true" ]]; then
            exit 0
          fi
          if [[ "$current" == "$TAG" ]]; then
            echo "이미 $TAG 입니다"
            exit 0
          fi
          aws ssm put-parameter --name "$PARAMETER" --value "$TAG" --type String --overwrite --query Version --output text
          echo "갱신: $current → $TAG"
