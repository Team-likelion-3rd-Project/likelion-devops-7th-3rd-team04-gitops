# amazon-eks-pod-identity-webhook — kubeadm 클러스터의 자체 IRSA.
# 아래 values 의 ServiceAccount 로 뜨는 파드에 AWS_ROLE_ARN · 웹 ID 토큰(aud sts.amazonaws.com)을 주입한다.
# 발급자(OIDC) · keys.json 은 Terraform 10-global · Ansible, IAM Role 은 Terraform 70 irsa.tf
type: helm
repo: https://jkroepke.github.io/helm-charts
chart: amazon-eks-pod-identity-webhook
version: "2.6.5"   # webhook v0.6.17
namespace: pod-identity-webhook
release: pod-identity-webhook
# Role ARN 의 계정 ID(global.awsAccountId) 를 클러스터 값으로 받는다 (README "클러스터 값")
clusterValues: true
# cert-manager 다음, IRSA 를 쓰는 앱(external-secrets 등) 보다 먼저
order: 20
