# amazon-eks-pod-identity-webhook chart values (prod)
#
# ns/SA → Role 매핑은 SA annotation 대신 여기(ConfigMap pod-identity-webhook)에 모은다.
# Role ARN 의 계정 ID 는 public 레포에 두지 않고 ArgoCD root 앱이 넘기는 global.awsAccountId 로 채운다.
# 매핑을 추가할 때는 Terraform 70 irsa.tf 의 irsa_roles(신뢰 정책 sub) 에도 같은 ns/SA 를 추가한다
config:
  defaultAwsRegion: us-east-1
  podIdentityWebhookMap:
    enabled: true
    data:
      "external-secrets/external-secrets":
        RoleARN: "arn:aws:iam::{{ .Values.global.awsAccountId }}:role/team04-hotel-external-secrets"
        Audience: sts.amazonaws.com
      # 결제 결과 큐(43-messaging) 수신. SA 는 backend 차트가 만든다
      "backend/booking-service":
        RoleARN: "arn:aws:iam::{{ .Values.global.awsAccountId }}:role/team04-hotel-booking-service"
        Audience: sts.amazonaws.com
      # 객실 사진 Presigned PUT 서명 · 업로드 확인 · 삭제 (13-frontend 사진 버킷)
      "backend/hotel-service":
        RoleARN: "arn:aws:iam::{{ .Values.global.awsAccountId }}:role/team04-hotel-hotel-service"
        Audience: sts.amazonaws.com
      # 시드 Job 의 객실 사진 올리기 (13-frontend 사진 버킷 room-types/* PutObject 만). SA 는 backend 차트(seed.enabled)가 만든다
      "backend/seed":
        RoleARN: "arn:aws:iam::{{ .Values.global.awsAccountId }}:role/team04-hotel-seed"
        Audience: sts.amazonaws.com
      # 챗봇 (LDP-143). 대화 테이블(41-main-data DynamoDB) PutItem · Query
      "backend/chat-bot-service":
        RoleARN: "arn:aws:iam::{{ .Values.global.awsAccountId }}:role/team04-hotel-chat-bot-service"
        Audience: sts.amazonaws.com
      # RAG 인덱스(15-chatbot-vectors) 조회만. Vertex AI 는 GCP Workload Identity (IRSA 아님)
      "backend/llm-service":
        RoleARN: "arn:aws:iam::{{ .Values.global.awsAccountId }}:role/team04-hotel-llm-service"
        Audience: sts.amazonaws.com
      # RAG 적재 Job 의 인덱스 쓰기만. SA 는 backend 차트(llmIngest.enabled)가 만든다
      "backend/llm-ingest":
        RoleARN: "arn:aws:iam::{{ .Values.global.awsAccountId }}:role/team04-hotel-llm-ingest"
        Audience: sts.amazonaws.com
      # 클러스터 로그 수집 (LDP-144). 21-observability-base 로그 그룹 쓰기 · 로그 버킷 app-logs/main-cluster/ PutObject 만
      "fluent-bit/fluent-bit":
        RoleARN: "arn:aws:iam::{{ .Values.global.awsAccountId }}:role/team04-hotel-fluent-bit"
        Audience: sts.amazonaws.com
      # Prometheus 알림 (LDP-179). 10-global 알림 토픽 Publish 만. SA 이름은 kube-prometheus-stack values alertmanager.serviceAccount.name
      "monitoring/kube-prometheus-stack-alertmanager":
        RoleARN: "arn:aws:iam::{{ .Values.global.awsAccountId }}:role/team04-hotel-alertmanager"
        Audience: sts.amazonaws.com
      # Grafana CloudWatch 데이터 소스 (LDP-180). 지표 읽기 · 이 프로젝트 로그 그룹 조회만. SA 이름은 kube-prometheus-stack values grafana.serviceAccount.name
      "monitoring/kube-prometheus-stack-grafana":
        RoleARN: "arn:aws:iam::{{ .Values.global.awsAccountId }}:role/team04-hotel-grafana"
        Audience: sts.amazonaws.com

# 파드 생성마다 호출되므로 워커 2대에 나눠 띄운다
replicaCount: 2
podDisruptionBudget:
  enabled: true
  minAvailable: 1
affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          topologyKey: kubernetes.io/hostname
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: amazon-eks-pod-identity-webhook

mutatingWebhook:
  # Ignore 면 webhook 이 준비되기 전에 만든 파드가 자격 증명 없이 떠서 그대로 남는다 (재생성 직후 ESO 등).
  # Fail 이면 파드 생성이 거부되고 컨트롤러가 다시 만들어 주입된다.
  # webhook 장애가 노드 · 네트워크 · 인증서 · 배포(ArgoCD) 복구를 막지 않도록 아래 네임스페이스는 호출하지 않는다
  failurePolicy: Fail
  namespaceSelector:
    matchExpressions:
      - key: kubernetes.io/metadata.name
        operator: NotIn
        values:
          - kube-system
          - tigera-operator
          - calico-system
          - calico-apiserver
          - cert-manager
          - argocd
