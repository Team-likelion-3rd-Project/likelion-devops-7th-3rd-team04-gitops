# 자리 수 · 크기. 한 자리 = 가장 먼저 늘어나는 Pod 1개 (api-gateway requests 와 같게)
# 자리 합계는 "노드 1대에서 데몬셋을 뺀 만큼"(t3a.large ~1.5코어)에 맞춘다 — 작으면 자리 맡기가 띄운 노드에 빈자리가 덤으로 남아
# 선점 · 다음 노드 선증설이 일어나지 않는다 (min_size 를 1 올린 것과 같아짐)
# replicas 0 이면 자리를 비우지 않는다 (끄기)
# 부하 테스트 3일차 ② — 노드 3대 기준 남는 자리(약 1.4코어)에 맞춤. 3개(1.5코어)면 평소 4대가 됨 (1단계 확인)
replicas: 2
resources:
  requests: {cpu: 500m, memory: 128Mi}
  limits: {cpu: 500m, memory: 128Mi}
# 일반 Pod(0) 보다 낮아 밀려나고, CA 의 expendable-pods-priority-cutoff(-10) 보다 높아 CA 가 이 Pod 를 위해 노드를 늘린다
priority: -1
image: registry.k8s.io/pause:3.10
