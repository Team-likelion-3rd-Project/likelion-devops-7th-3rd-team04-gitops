# aws-for-fluent-bit chart values (prod)
#
#   tail /var/log/containers/*.log ─ kubernetes 메타데이터 ─ Lua(로그 그룹 결정) ─┬→ CloudWatch Logs /team04-hotel/prod/cluster/<네임스페이스>
#                                                                                 └→ S3 team04-hotel-logs/app-logs/main-cluster/<날짜>/<노드>/
#
# CloudWatch 로그 그룹은 매일 destroy 로 지워지고, 버킷(🔒 10-global, Object Lock 7일 · 90일 보관)에 같은 로그가 남는다.
# ServiceAccount 이름 fluent-bit 는 pod-identity-webhook 매핑 · Terraform 70 irsa.tf 신뢰 정책 sub 와 같아야 한다

fullnameOverride: fluent-bit

serviceAccount:
  create: true
  name: fluent-bit

# 로그 수집이 노드 압박으로 먼저 쫓겨나지 않게 한다
priorityClassName: system-node-critical

# 모든 노드에 하나씩. CP(node-role.kubernetes.io/control-plane:NoSchedule) · 종료 예정 노드 taint 도 견딘다
tolerations:
  - operator: Exists

# 파일 읽기만 하는 root. 노드 /var/log 는 root 소유라 권한(capability) 없이 읽고 쓸 수 있다
containerSecurityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

# S3 객체 경로에 노드 이름을 넣는다 (노드마다 따로 올리므로 같은 시각 객체가 겹치지 않게)
env:
  - name: NODE_NAME
    valueFrom:
      fieldRef:
        fieldPath: spec.nodeName

# containerd 로그는 /var/log/pods (containers/*.log 는 그쪽 symlink). docker 경로는 쓰지 않는다
volumes:
  - name: varlog
    hostPath:
      path: /var/log
volumeMounts:
  - name: varlog
    mountPath: /var/log

input:
  memBufLimit: 10MB
  # 위치 DB(input.db, 노드 /var/log) 가 없는 첫 실행에는 파일 처음부터 읽는다 — Fluent Bit 보다 먼저 뜬 파드
  # (kube-system · calico · argocd · traefik 등)의 시작 로그를 빠뜨리지 않는다. 재시작 후에는 DB 위치부터 이어 읽는다
  extraInputs: |
    Read_from_Head    On

filter:
  # JSON 로그는 data 아래로 펼치고 원문(log)은 버린다 (JSON 이 아니면 log 를 그대로 둔다)
  keepLog: "Off"
  # 라벨 · 어노테이션은 붙이지 않는다 (크기 · 노출 줄이기). 네임스페이스 · 파드 · 컨테이너 · 노드 이름만 남는다
  extraFilters: |
    Labels              Off
    Annotations         Off

# 로그 그룹 결정: Terraform 21 cluster_log_namespaces 에 있는 네임스페이스는 자기 그룹, 나머지는 other.
# 그룹은 Fluent Bit 이 만들지 않으므로(auto_create_group off) 목록에 없는 그룹으로 보내면 거부된다 — 두 목록을 같이 고친다
additionalFilters: |
  [FILTER]
      Name    lua
      Match   kube.*
      call    set_log_group
      code    local known = {["kube-system"]=true, ["tigera-operator"]=true, ["calico-system"]=true, ["calico-apiserver"]=true, ["argocd"]=true, ["traefik"]=true, ["cert-manager"]=true, ["pod-identity-webhook"]=true, ["fluent-bit"]=true, ["whoami"]=true, ["external-secrets"]=true, ["backend"]=true} function set_log_group(tag, ts, record) local k = record["kubernetes"] local ns = k and k["namespace_name"] if not (ns and known[ns]) then ns = "other" end record["log_group_ns"] = ns return 2, ts, record end

cloudWatchLogs:
  enabled: true
  match: "kube.*"
  region: us-east-1
  # 템플릿 값이 없을 때만 쓰는 그룹 · 스트림
  logGroupName: /team04-hotel/prod/cluster/other
  logStreamPrefix: "fallback-"
  logGroupTemplate: /team04-hotel/prod/cluster/$log_group_ns
  logStreamTemplate: $kubernetes['pod_name'].$kubernetes['container_name']
  autoCreateGroup: false
  extraOutputs: |
    Retry_Limit           5

s3:
  enabled: true
  match: "kube.*"
  bucket: team04-hotel-logs
  region: us-east-1
  # 노드 시각(UTC) 기준 날짜. 5분마다 또는 50MB 마다 gzip 객체 하나
  s3KeyFormat: /app-logs/main-cluster/%Y/%m/%d/${NODE_NAME}/%H-%M-%S-$UUID.gz
  totalFileSize: 50M
  uploadTimeout: 5m
  compression: gzip
  # PutObject 하나로 올린다 (멀티파트 미사용 → IRSA Role 은 s3:PutObject 만)
  usePutObject: true
  # Object Lock 버킷은 Content-MD5 없는 PutObject 를 거부한다
  sendContentMd5: true
  # 올리기 전 버퍼를 노드 디스크에 둬 파드가 재시작돼도 남게 한다 (노드가 지워지면 마지막 5분은 사라짐)
  storeDir: /var/log/fluent-bit/s3
  retryLimit: 5
