# metrics-server — HPA · kubectl top 이 쓰는 Resource Metrics API (Prometheus 와 별개).
# 온프레미스(infra/ansible group_vars/control_plane.yml metrics_server_chart_version)와 같은 버전을 쓴다
type: helm
repo: https://kubernetes-sigs.github.io/metrics-server/
chart: metrics-server
version: "3.14.0"   # metrics-server v0.9.0
namespace: kube-system
release: metrics-server
# 다른 앱과 의존이 없다 (kube-system 은 pod-identity-webhook 대상이 아님)
order: 25
