# Traefik chart values (prod). 온프레미스는 infra/ansible roles/traefik 템플릿을 쓴다
#
# 워커는 ASG 라 교체 · 확장된다. 어느 워커 NodePort 로 들어와도 응답하도록 워커에 2개 띄우고
# externalTrafficPolicy Cluster 를 쓴다 (앞단 ALB 가 출발지라 Local 로 클라이언트 IP 를 보존할 이유가 없다)
deployment:
  replicas: 2
  # Cluster Autoscaler 가 이 Pod 가 있는 노드도 줄일 수 있게 한다. 차트가 /data · /tmp 를 emptyDir 로 붙여 "local storage" 로
  # 분류되면 CA 가 노드 축소를 건너뛴다 (4차 CA 로그 `pod with local storage present`). 보존할 데이터 없음 (LDP-259)
  podAnnotations:
    cluster-autoscaler.kubernetes.io/safe-to-evict: "true"

# HPA 2~4 (LDP-259) — 모든 요청의 입구라 부하에 비례해 CPU 를 쓴다 (4차 1,000 요청/초 Pod 당 0.36 → 4개면 약 0.18).
# 고정 4개는 평소 requests +600m 로 앱 노드가 1대 늘어 평소 2개 · 부하 때만 확장 (requests 300m 의 70%). HPA 를 켜면 replicas 는 무시된다
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70

# hotel · booking 이 없는 노드 우선 (preferred — 자리가 없으면 그래도 배치, Pending 없음, LDP-259).
# traefik · hotel · booking 이 한 노드에 겹치면 그 노드가 먼저 100% (4차: 같은 부하에서 gateway 만 있는 노드는 45–50%)
affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          topologyKey: kubernetes.io/hostname
          namespaces: [backend]
          labelSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values: [hotel-service, booking-service]

# 노드마다 1개 (LDP-237). 모든 요청의 입구라 2개가 한 노드 · 포화된 노드에 몰리면 전체가 같이 밀린다
# (11-05 load 350: 지연이 traefik → gateway 처리 시작 전 구간에서 발생, 분산 후 p95 334 → 64ms).
# 노드가 1대뿐이면 2번째 Pod 는 Pending → Cluster Autoscaler 증설. 롤아웃 중 옛 Pod 는 세지 않는다 (pod-template-hash)
# platform 노드(taint, LDP-248)는 계산에서 뺀다 — 기본값(Ignore)이면 Pod 를 놓을 수 없는 platform 노드가
# "0개인 노드"로 세어져, 앱 노드마다 1개씩 있어도 더 놓을 곳이 없다고 판단한다
topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: DoNotSchedule
    nodeTaintsPolicy: Honor
    labelSelector:
      matchLabels:
        app.kubernetes.io/name: traefik
        app.kubernetes.io/instance: traefik-traefik
    matchLabelKeys: [pod-template-hash]

# requests 가 없으면 스케줄러가 0 으로 계산해 hotel · booking 과 같은 노드에 과밀 배치된다 (4차 stress 1회차 붕괴 원인, LDP-259).
# 4차 실사용 Pod 당 0.27–0.36 코어 · 메모리 최대 808Mi. limit 은 두지 않음 (입구라 throttling · OOM 이 전체 장애)
resources:
  requests: { cpu: 300m, memory: 256Mi }

# 노드 drain · Cluster Autoscaler 축소 때 2개가 한꺼번에 내려가지 않게 (eviction 만 해당, 롤링 업데이트는 별도, LDP-248)
podDisruptionBudget:
  enabled: true
  maxUnavailable: 1

ingressClass:
  enabled: true
  isDefaultClass: false
  name: traefik

providers:
  kubernetesIngress:
    enabled: true
    # Service(NodePort) status 를 복사하지 않고 아래 additionalArguments 의 hostname 을 쓴다 (켜 두면 hostname 보다 우선)
    publishedService:
      enabled: false
  kubernetesCRD:
    enabled: true

# Ingress status(loadBalancer.ingress)에 진입 주소를 쓴다. NodePort Service 라 Traefik 이 채울 값이 없는데,
# ArgoCD 는 status 가 비어 있는 Ingress 를 Progressing 으로 봐서 root 앱이 다음 sync-wave 로 넘어가지 못한다.
# 값은 앞단 80-main-edge ALB 의 API 도메인 (frontend/values.yaml build.VITE_API_URL 과 같음)
additionalArguments:
  - --providers.kubernetesingress.ingressendpoint.hostname=api.meomulm.click

ports:
  web:
    # 80-main-edge ALB Target Group · 30-security M2 규칙과 같은 포트
    nodePort: 30080
    # ALB 가 붙인 X-Forwarded-For(클라이언트 IP)를 유지한다. Traefik 이 보는 출발지는 Cluster 정책 SNAT 로
    # 워커 IP(Main VPC CIDR) 또는 다른 워커의 vxlan.calico IP(Pod CIDR) 다
    forwardedHeaders:
      trustedIPs: ["10.10.0.0/16", "10.0.0.0/16"]
  websecure:
    # TLS 는 ALB 에서 종료한다
    expose:
      default: false

# 80-main-edge ALB Target Group 헬스체크용. Traefik 자체 /ping 을 web 엔트리포인트(NodePort)에 노출
ingressRoute:
  healthcheck:
    enabled: true
    entryPoints: ["web"]

service:
  spec:
    type: NodePort
    externalTrafficPolicy: Cluster

# 클라이언트 IP / 라우팅 확인용
accessLog:
  enabled: true
