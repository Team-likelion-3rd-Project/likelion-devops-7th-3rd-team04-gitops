{{- with .Values.seedAdmin }}
{{- if .enabled }}
# 시드 관리자 계정 (backend 차트 seed.adminSecretName). backend-secrets 와 따로 두는 이유:
#   Secrets Manager 쪽 값이 없거나 읽지 못해도 서비스용 Secret(backend-secrets) 동기화는 영향을 받지 않고 시드 Job 만 기다린다
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .secretName }}
  labels:
    app.kubernetes.io/managed-by: {{ $.Release.Service }}
spec:
  refreshInterval: {{ $.Values.refreshInterval }}
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ $.Values.clusterSecretStore }}
  target:
    name: {{ .secretName }}
    creationPolicy: Owner
  data:
    {{- range $key, $property := .data }}
    - secretKey: {{ $key }}
      remoteRef:
        key: {{ $.Values.seedAdmin.remoteKey }}
        property: {{ $property }}
    {{- end }}
{{- end }}
{{- end }}
