# cluster-autoscaler values — 72 EKS 만 (values.yaml 위에 더한다).
# 운영 도구는 platform 노드에 (Terraform 72 nodes.tf platform 노드 그룹의 label · taint 와 같은 값, LDP-248)
nodeSelector:
  role: platform
tolerations:
  - key: dedicated
    operator: Equal
    value: platform
    effect: NoSchedule

# 영역마다 1개 (platform-a · platform-b, LDP-259). 리더 선출이라 일하는 건 1개, 나머지는 대기 — 한 영역 장애에도 확장 · 축소가 이어진다.
# PDB 는 차트 기본값(maxUnavailable 1)
replicaCount: 2
topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: topology.kubernetes.io/zone
    whenUnsatisfiable: DoNotSchedule
    labelSelector:
      matchLabels:
        app.kubernetes.io/instance: cluster-autoscaler
        app.kubernetes.io/name: aws-cluster-autoscaler
    matchLabelKeys: [pod-template-hash]
