# prometheus-mysql-exporter — 메인 RDS 의 쿼리 수 · 락 대기 · 슬로우 쿼리 수 등 CloudWatch 에 없는 지표 (LDP-180).
# 계정 · my.cnf · CA 는 mysql-exporter-setup 앱이 만든다. 토글: 두 앱을 같이 켜고 끈다 (둘 다 enabled: false 가 기본).
# 결제 RDS 는 Payment VPC 라 메인 클러스터에서 닿지 않아 CloudWatch 지표 · 로그만 본다
type: helm
repo: https://prometheus-community.github.io/helm-charts
chart: prometheus-mysql-exporter
version: "2.16.0"   # mysqld_exporter v0.21.0
namespace: monitoring
release: mysql-exporter
enabled: true   # 검증용 (PR 에서는 false)
# mysql-exporter-setup(62, 계정 생성 Job) 다음 — 계정이 없으면 mysql_up 0 으로 계속 재시도한다
order: 65
