# cert-manager values — 72 EKS 만 (values.yaml 위에 더한다).
# 운영 도구는 platform 노드에 (Terraform 72 nodes.tf platform 노드 그룹의 label · taint 와 같은 값, LDP-248)
# controller · webhook · cainjector 2개씩 · 영역마다 1개 (platform-a · platform-b, LDP-259). controller · cainjector 는 리더 선출
nodeSelector:
  role: platform
tolerations:
  - key: dedicated
    operator: Equal
    value: platform
    effect: NoSchedule
replicaCount: 2
topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: topology.kubernetes.io/zone
    whenUnsatisfiable: DoNotSchedule
    labelSelector:
      matchLabels:
        app.kubernetes.io/instance: cert-manager
        app.kubernetes.io/component: controller
    matchLabelKeys: [pod-template-hash]
podDisruptionBudget:
  enabled: true
  maxUnavailable: 1
webhook:
  nodeSelector:
    role: platform
  tolerations:
    - key: dedicated
      operator: Equal
      value: platform
      effect: NoSchedule
  replicaCount: 2
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: topology.kubernetes.io/zone
      whenUnsatisfiable: DoNotSchedule
      labelSelector:
        matchLabels:
          app.kubernetes.io/instance: cert-manager
          app.kubernetes.io/component: webhook
      matchLabelKeys: [pod-template-hash]
  podDisruptionBudget:
    enabled: true
    maxUnavailable: 1
cainjector:
  nodeSelector:
    role: platform
  tolerations:
    - key: dedicated
      operator: Equal
      value: platform
      effect: NoSchedule
  replicaCount: 2
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: topology.kubernetes.io/zone
      whenUnsatisfiable: DoNotSchedule
      labelSelector:
        matchLabels:
          app.kubernetes.io/instance: cert-manager
          app.kubernetes.io/component: cainjector
      matchLabelKeys: [pod-template-hash]
  podDisruptionBudget:
    enabled: true
    maxUnavailable: 1
startupapicheck:
  nodeSelector:
    role: platform
  tolerations:
    - key: dedicated
      operator: Equal
      value: platform
      effect: NoSchedule
