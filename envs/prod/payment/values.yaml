# prod 결제 서버 (결제 VPC, EKS 밖 — Terraform 60-payment-app) 의 배포 상태.
# 온프레미스 dev 의 결제 노드(infra/ansible payment.yml)와 같은 구성: 결제 DB 마이그레이션 → payment-service.
#
# ⚠️ 이 레포는 public 입니다. 결제 DB 비밀번호 · TOSS_SECRET_KEY 등은 넣지 않습니다 (AWS Secrets Manager).
#
# imageTag 는 GitLab main 파이프라인이 ECR push 후 여는 PR 로 갱신됩니다 — backend 와 같은 커밋이면 같은 값.
# 결제 쪽 계약(payment.proto, SQS 메시지, 결제 마이그레이션)이 바뀌는 배포는 이 파일을 먼저 merge·반영한 뒤 backend 를 올립니다.

image:
  registry: "<account-id>.dkr.ecr.us-east-1.amazonaws.com" # TODO: prod 계정 ID
  imageTag: "36607deaec7ee9081d23b568c918bf103489bc1b" # 릴리스 main 커밋 SHA (GitLab release:gitops-pr)
  # 같은 태그로 아래 두 이미지를 씀
  repositories:
    app: team04-hotel/payment-service
    migrations: team04-hotel/payment-migrations # TODO: Terraform 11-registry 에 리포지토리 추가 필요
# 비밀이 아닌 설정만 (비밀값은 Secrets Manager 에서 결제 서버가 직접 읽음)
env:
  NODE_ENV: production
  PAYMENT_PROVIDER: TOSS
  SQS_ENDPOINT: "" # 비움 = AWS 기본 주소 (자격증명은 인스턴스 IAM 역할)
  SQS_REGION: us-east-1
  PAYMENT_RESULT_QUEUE_URL: "https://sqs.us-east-1.amazonaws.com/<account-id>/payment-result.fifo" # TODO
  # 메인 클러스터의 booking-service gRPC — prod 에는 결제 → 메인 방향 경로가 없음 (PrivateLink 는 메인 → 결제만).
  # 백엔드가 결제 → booking 호출을 없애기 전까지는 미정 (README "알려진 제약")
  BOOKING_SERVICE_HOST: ""
