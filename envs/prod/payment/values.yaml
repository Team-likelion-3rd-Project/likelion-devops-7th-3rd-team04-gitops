# prod 결제 서버 (결제 VPC, 메인 클러스터 밖 — Terraform 60-payment-app) 의 배포 상태.
# merge 하면 sync-payment-tag workflow 가 {image.imageTag, env} 를 Parameter Store 에 쓰고,
# 결제 서버 pull agent 가 1분 안에 Flyway(payment-migrations) → payment-service 교체 → 헬스 확인을 합니다. 실패하면 이전 버전으로 되돌립니다.
# pg-mock 인스턴스(부하 테스트용)도 같은 imageTag 를 씁니다.
#
# ⚠️ 이 레포는 public 입니다. 결제 DB 비밀번호 · TOSS_SECRET_KEY 등은 넣지 않습니다 (AWS Secrets Manager 에서 결제 서버가 직접 읽음).
#
# imageTag 는 GitLab main 파이프라인이 ECR push 후 여는 PR 로 갱신됩니다 — backend 와 같은 커밋이면 같은 값.
# 결제 쪽 계약(payment.proto, SQS 메시지, 결제 마이그레이션)이 바뀌는 배포는 이 파일을 먼저 merge·반영한 뒤 backend 를 올립니다.

image:
  imageTag: "d763b95e0aa7ba215046794338c713a126fda8d4" # 릴리스 main 커밋 SHA (GitLab release:gitops-pr)
  # 같은 태그로 아래 이미지를 씀 (레지스트리 · 저장소는 Terraform 이 정함 — 참고용)
  repositories:
    app: team04-hotel/payment-service
    migrations: team04-hotel/payment-migrations
    mock: team04-hotel/pg-mock-service
# 비밀이 아닌 설정만. 값은 문자열로 넘어갑니다.
# 인프라가 넣는 값은 여기서 바꿀 수 없습니다 (validate · 결제 서버 agent 가 거부):
#   PAYMENT_DB_* · TOSS_SECRET_KEY · SQS_* · PAYMENT_RESULT_QUEUE_URL · PG_MOCK_SERVICE_URL · AWS_* · HEALTH_PORT
env:
  NODE_ENV: production
  # TOSS = 토스 테스트 · 실결제 API, MOCK = 결제 VPC 의 pg-mock 인스턴스 (부하 테스트). PR 로 전환
  PAYMENT_PROVIDER: TOSS
