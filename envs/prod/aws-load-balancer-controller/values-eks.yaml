# aws-load-balancer-controller values — 72 EKS 만 (values.yaml 위에 더한다).
# 운영 도구는 platform 노드에 (Terraform 72 nodes.tf platform 노드 그룹의 label · taint 와 같은 값, LDP-248)
nodeSelector:
  role: platform
tolerations:
  - key: dedicated
    operator: Equal
    value: platform
    effect: NoSchedule

# 차트 기본 2개를 영역마다 1개로 (platform-a · platform-b, LDP-259). 리더 선출 — 한 영역 장애에도 ALB · TG 갱신이 이어진다
topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: topology.kubernetes.io/zone
    whenUnsatisfiable: DoNotSchedule
    labelSelector:
      matchLabels:
        app.kubernetes.io/name: aws-load-balancer-controller
        app.kubernetes.io/instance: aws-load-balancer-controller
    matchLabelKeys: [pod-template-hash]
podDisruptionBudget:
  maxUnavailable: 1
