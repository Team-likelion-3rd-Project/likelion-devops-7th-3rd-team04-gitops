# prod(AWS kubeadm) backend Helm values — 모노레포 backend-deploy/charts/backend 의 values.yaml 을 덮어씁니다.
# 차트 위치 · 커밋은 같은 폴더의 chart.yaml 에 고정되어 있습니다.
#
# ⚠️ public 레포로 복사됩니다. 비밀번호 · 키 · 토큰 · 계정 ID 는 넣지 않습니다.
#    Secret(global.secretName) 은 backend-secrets 앱이 AWS Secrets Manager → External Secrets 로 만듭니다.
#    계정 ID 는 배포 agent 가 넘기는 {{ .Values.global.awsAccountId }} 로 씁니다 (imageRegistry · services.*.env 는 차트가 tpl 로 렌더링).
#
# global.imageTag 는 릴리스 때 GitLab main 파이프라인이 ECR push 후 여는 PR 로 갱신됩니다 — 사람이 리뷰 · 승인 후 merge.
# 태그는 main 커밋 SHA 전체(40자)이고 chart.yaml 의 revision 과 같은 값입니다.

global:
  # Terraform 11-registry: <account>.dkr.ecr.us-east-1.amazonaws.com / team04-hotel/<서비스>
  imageRegistry: "{{ .Values.global.awsAccountId }}.dkr.ecr.us-east-1.amazonaws.com"
  imageRepositoryPrefix: team04-hotel/
  # 커밋 SHA (latest 금지 — 차트가 렌더링을 거부, ECR 도 IMMUTABLE)
  imageTag: "0f42096f052fb7f81496426e87a11f260a12e2cb" # 릴리스 main 커밋 SHA (GitLab release:gitops-pr)
  # 워커 kubelet 이 노드 Role 로 ECR pull (ecr-credential-provider, Ansible aws_ecr_credential_provider) → imagePullSecret 불필요
  imagePullSecrets: []
  secretName: backend-secrets
# 서비스별 SA — IRSA 매핑(pod-identity-webhook values)이 backend/<서비스 이름> 기준
serviceAccounts:
  create: true
# api-gateway 외부 노출: ALB(Terraform 80-main-edge) → 워커 NodePort 30080 → Traefik → api-gateway
ingress:
  enabled: true
  className: traefik
  # api.<도메인> 만 라우팅 (Terraform 80-main-edge 가 같은 이름의 Route53 레코드 생성). ALB DNS 이름으로 직접 오는 요청은 404
  host: "api.meomulm.click"
  paths:
    - /api
services:
  api-gateway:
    replicas: 2
    env:
      # 프론트(13-frontend) 출처. 하나만 허용하므로 www 는 CloudFront 에서 루트로 리다이렉트
      CORS_ORIGIN: "https://meomulm.click"
      # 결제 서버는 결제 VPC — 메인 VPC 의 PrivateLink 엔드포인트 고정 이름으로 호출 (Terraform 71-payment-link, 재생성해도 같음)
      PAYMENT_SERVICE_HOST: "payment.team04-hotel.internal:3004"
  booking-service:
    replicas: 2
    env:
      # 결제 서버 gRPC (PrivateLink, Terraform 71-payment-link)
      PAYMENT_SERVICE_HOST: "payment.team04-hotel.internal:3004"
      # 결제 결과 이벤트 (SQS FIFO, 43-messaging). SQS_ENDPOINT 비움 = AWS 기본 주소, 자격 증명은 IRSA(team04-hotel-booking-service)
      SQS_ENDPOINT: ""
      SQS_REGION: us-east-1
      PAYMENT_RESULT_QUEUE_URL: "https://sqs.us-east-1.amazonaws.com/{{ .Values.global.awsAccountId }}/payment-result.fifo"
  hotel-service:
    env:
      # 객실 사진 버킷 (13-frontend). 엔드포인트 · 키를 비우면 AWS 기본 주소 + IRSA(team04-hotel-hotel-service)
      S3_BUCKET: team04-hotel-room-images
      S3_REGION: us-east-1
      S3_FORCE_PATH_STYLE: "false"
      S3_ENDPOINT: ""
      S3_PUBLIC_ENDPOINT: ""
      # 사진 보기 = 서명 없는 CloudFront 고정 URL <IMAGE_BASE_URL>/<objectKey> (/room-types/* behavior). 올리기는 Presigned PUT
      IMAGE_BASE_URL: "https://meomulm.click"
  auth-service:
    env:
      # ElastiCache Valkey 는 전송 암호화 required (41-main-data)
      REDIS_TLS: "true"
  chat-bot-service:
    env:
      DYNAMODB_REGION: us-east-1
      # 41-main-data dynamodb_table_names. 테이블 접근 IRSA 와 n8n 은 82-gcp-llm 에서 (그 전까지 채팅 요청은 실패)
      DYNAMODB_CHAT_SESSIONS_TABLE: team04-hotel-ChatSessions
      DYNAMODB_CHAT_MESSAGES_TABLE: team04-hotel-ChatMessages
  # prod 는 결제 VPC 의 결제 서버(클러스터 밖)가 운영 → 클러스터에는 배포하지 않음. 이미지 태그는 envs/prod/payment
  payment-service:
    enabled: false
  # prod 는 실제 PG(토스)를 결제 서버가 직접 호출 → 목업 불필요
  pg-mock-service:
    enabled: false
migrations:
  # 메인 DB(RDS, 41-main-data) — 배포 직전 hook 으로 Flyway 적용. RDS 서버 인증서를 검증하는 TLS 로 접속
  # Flyway 이미지의 드라이버는 MariaDB Connector/J 2.x 라 3.x 옵션 sslMode 는 무시되고 평문으로 붙는다.
  # 2.x 는 useSsl + serverSslCert 이고 호스트 이름 검증은 기본으로 켜져 있다
  main:
    enabled: true
    db:
      jdbcParams: "useSsl=true&serverSslCert=/flyway/certs/us-east-1-bundle.pem"
      caConfigMap: rds-ca-bundle # backend-secrets 앱
  # 결제 DB 는 결제 서버 쪽에서 적용 (클러스터에서 결제 DB 에 접근하지 않음)
  payment:
    enabled: false
