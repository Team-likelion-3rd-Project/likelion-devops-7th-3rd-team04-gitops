# prod(AWS kubeadm) backend Helm values — 모노레포 backend-deploy/charts/backend 의 values.yaml 을 덮어씁니다.
# 차트 위치 · 커밋은 같은 폴더의 chart.yaml 에 고정되어 있습니다.
#
# ⚠️ public 레포로 복사됩니다. 비밀번호 · 키 · 토큰 · 계정 ID 는 넣지 않습니다.
#    Secret(global.secretName) 은 backend-secrets 앱이 AWS Secrets Manager → External Secrets 로 만듭니다.
#    계정 ID 는 ArgoCD root 앱이 넘기는 {{ .Values.global.awsAccountId }} 로 씁니다 (imageRegistry · services.*.env 는 차트가 tpl 로 렌더링).
#
# global.imageTag 는 릴리스 때 GitLab main 파이프라인이 ECR push 후 여는 PR 로 갱신됩니다 — 사람이 리뷰 · 승인 후 merge.
# 태그는 main 커밋 SHA 전체(40자)이고 chart.yaml 의 revision 과 같은 값입니다.

global:
  # Terraform 11-registry: <account>.dkr.ecr.us-east-1.amazonaws.com / team04-hotel/<서비스>
  imageRegistry: "{{ .Values.global.awsAccountId }}.dkr.ecr.us-east-1.amazonaws.com"
  imageRepositoryPrefix: team04-hotel/
  # 커밋 SHA (latest 금지 — 차트가 렌더링을 거부, ECR 도 IMMUTABLE)
  imageTag: "41b696f257dd402d30974e7425366913a80b7f33" # 릴리스 main 커밋 SHA (GitHub Actions release.yml)
  # 워커 kubelet 이 노드 Role 로 ECR pull (ecr-credential-provider, Ansible aws_ecr_credential_provider) → imagePullSecret 불필요
  imagePullSecrets: []
  secretName: backend-secrets
# 서비스별 SA — IRSA 매핑(pod-identity-webhook values)이 backend/<서비스 이름> 기준
serviceAccounts:
  create: true
# api-gateway 외부 노출: ALB(Terraform 80-main-edge) → 워커 NodePort 30080 → Traefik → api-gateway
ingress:
  enabled: true
  className: traefik
  # api.<도메인> 만 라우팅 (Terraform 80-main-edge 가 같은 이름의 Route53 레코드 생성). ALB DNS 이름으로 직접 오는 요청은 404
  host: "api.meomulm.click"
  paths:
    - /api
# Prometheus 메트릭 (LDP-179) — 서비스마다 METRICS_PORT(9464) + PodMonitor 1개. 수집은 kube-prometheus-stack 앱.
# 9464 는 containerPort 만이라 Service · Ingress 로 노출되지 않는다. llm-service 는 차트 기본값(metrics: false)으로 빠짐.
# PodMonitor CRD 는 prometheus-operator-crds 앱(order 12)이 먼저 설치한다
metrics:
  enabled: true
# 같은 서비스 Pod 를 노드마다 나눈다 (LDP-227) — 11-04 부하 테스트에서 한 노드에 gateway · hotel · booking 이 몰려 그 노드만 먼저 포화
topologySpread:
  enabled: true
# resources · HPA (LDP-227) — 11-04 부하 테스트 노드 2대 기준. requests 합계가 노드 2대 할당량(3.86코어) 안에 들어가고,
# HPA 가 늘린 Pod 가 자리가 없으면 Cluster Autoscaler 가 노드를 늘린다. 기준선(50m / 500m) 대비 SLO 유지 최대 ~150 → ~250 요청/초
services:
  api-gateway:
    # 모든 요청이 거친다. 200 요청/초에서 limit 500m 에 걸려 throttling 37~40%. DB 를 쓰지 않아 늘려도 RDS 연결 상한과 무관
    # requests 는 부하 시 실사용(250 요청/초 spike 에서 Pod 당 0.6 ~ 0.9코어)에 가깝게 둔다 — 300m 이면 HPA 가 늘린 Pod 가
    # 포화된 기존 노드에 그대로 들어가 Pending 이 생기지 않고 노드도 늘지 않았다 (11-04 검증). 500m 면 4개(2코어)가 2대에 안 들어가 증설된다
    # 요청당 CPU 약 4ms → 70%(350m) ≈ Pod당 85 요청/초에서 확장 시작. HPA 를 켜면 replicas 는 렌더링되지 않는다
    resources:
      requests: {cpu: 500m, memory: 128Mi}
      limits: {cpu: 1000m, memory: 512Mi}
    hpa:
      enabled: true
      minReplicas: 2
      maxReplicas: 4
      cpuUtilization: 70
    env:
      # 프론트(13-frontend) 출처. 하나만 허용하므로 www 는 CloudFront 에서 루트로 리다이렉트
      CORS_ORIGIN: "https://meomulm.click"
      # 서비스 간 gRPC 는 Headless Service 로 Pod 주소 목록을 받아 요청마다 분배 (LDP-160, 차트 grpcHeadless · round_robin)
      # 롤백 = 아래 *_SERVICE_HOST 줄 삭제 → 차트 기본값 <이름>:<포트>(ClusterIP) 로 복귀
      USER_SERVICE_HOST: "dns:///user-service-headless:3001"
      HOTEL_SERVICE_HOST: "dns:///hotel-service-headless:3002"
      BOOKING_SERVICE_HOST: "dns:///booking-service-headless:3003"
      CHAT_BOT_SERVICE_HOST: "dns:///chat-bot-service-headless:3005"
      AUTH_SERVICE_HOST: "dns:///auth-service-headless:3006"
      # 결제 서버는 결제 VPC — 메인 VPC 의 PrivateLink 엔드포인트 고정 이름으로 호출 (Terraform 71-payment-link, 재생성해도 같음)
      PAYMENT_SERVICE_HOST: "payment.team04-hotel.internal:3004"
      # 부하 테스트 브랜치 전용 — k6 는 생성기 IP 하나에서 보낸다. 1분 기준이라 stress 상한 500 요청/초 = 30,000 (기본 100)
      THROTTLE_LIMIT: "30000"
  booking-service:
    replicas: 2
    env:
      HOTEL_SERVICE_HOST: "dns:///hotel-service-headless:3002" # LDP-160
      # 결제 서버 gRPC (PrivateLink, Terraform 71-payment-link)
      PAYMENT_SERVICE_HOST: "payment.team04-hotel.internal:3004"
      # 결제 결과 이벤트 (SQS FIFO, 43-messaging). SQS_ENDPOINT 비움 = AWS 기본 주소, 자격 증명은 IRSA(team04-hotel-booking-service)
      SQS_ENDPOINT: ""
      SQS_REGION: us-east-1
      PAYMENT_RESULT_QUEUE_URL: "https://sqs.us-east-1.amazonaws.com/{{ .Values.global.awsAccountId }}/payment-result.fifo"
  hotel-service:
    # 호텔 조회를 모두 받는다. Pod 1개 · 커넥션 풀 10 에서 대기 413, 250 요청/초 throttling 57~63%.
    # 풀이 Pod 당 10 이라 replica 를 늘리면 RDS 연결(max_connections 68)도 10 씩 는다 — HPA 는 풀 조정 뒤에
    replicas: 2
    resources:
      requests: {cpu: 300m, memory: 128Mi}
      limits: {cpu: 1000m, memory: 512Mi}
    env:
      # 객실 사진 버킷 (13-frontend). 엔드포인트 · 키를 비우면 AWS 기본 주소 + IRSA(team04-hotel-hotel-service)
      S3_BUCKET: team04-hotel-room-images
      S3_REGION: us-east-1
      S3_FORCE_PATH_STYLE: "false"
      S3_ENDPOINT: ""
      S3_PUBLIC_ENDPOINT: ""
      # 사진 보기 = 서명 없는 CloudFront 고정 URL <IMAGE_BASE_URL>/<objectKey> (/room-types/* behavior). 올리기는 Presigned PUT
      IMAGE_BASE_URL: "https://meomulm.click"
      # 조회 캐시 Valkey(REDIS_HOST · REDIS_PASSWORD 는 차트 기본 secretEnv). ElastiCache 는 전송 암호화 required (41-main-data)
      REDIS_TLS: "true"
  auth-service:
    env:
      # ElastiCache Valkey 는 전송 암호화 required (41-main-data)
      REDIS_TLS: "true"
      # 부하 테스트 브랜치 전용 — k6 setup 토큰이 soak(45분) · 하루 테스트 동안 만료되지 않게 (기본 15m)
      JWT_ACCESS_EXPIRES_IN: "2h"
      # LDP-160 (api-gateway 주석 참고)
      USER_SERVICE_HOST: "dns:///user-service-headless:3001"
      BOOKING_SERVICE_HOST: "dns:///booking-service-headless:3003"
      # 카카오 로그인 후 돌아올 프론트 주소. 카카오 콘솔 Redirect URI 와 문자열까지 같아야 한다
      KAKAO_REDIRECT_URIS: "https://meomulm.click/auth/kakao/callback"
    # 차트 기본값 목록을 통째로 대체하므로 기본값 8개도 함께 적는다
    secretEnv:
      - DB_HOST
      - DB_USERNAME
      - DB_PASSWORD
      - DB_DATABASE
      - JWT_ACCESS_SECRET
      - JWT_REFRESH_SECRET
      - REDIS_HOST
      - REDIS_PASSWORD
      - KAKAO_CLIENT_ID
      - KAKAO_CLIENT_SECRET
  chat-bot-service:
    env:
      # DYNAMODB_ENDPOINT 미설정 = AWS 기본 주소, 자격 증명은 IRSA(team04-hotel-chat-bot-service, 두 테이블 PutItem · Query 만)
      DYNAMODB_REGION: us-east-1
      # 41-main-data dynamodb_table_names (매일 재생성 — 대화 이력은 다음 날 초기화)
      DYNAMODB_CHAT_SESSIONS_TABLE: team04-hotel-ChatSessions
      DYNAMODB_CHAT_MESSAGES_TABLE: team04-hotel-ChatMessages
  # 챗봇 답변 (chat-bot-service → n8n → llm-service → Vertex AI). 이미지 태그는 global.imageTag
  llm-service:
    enabled: true
    # GCP 서비스 계정 키를 쓰지 않는다 — 아래 gcpWorkloadIdentity 로 인증
    secretEnv: []
    gcpWorkloadIdentity: true
    env:
      # RAG 벡터 저장소 (Terraform 15-chatbot-vectors 🔒). 자격 증명은 IRSA(team04-hotel-llm-service, 조회만)
      VECTOR_STORE: s3vectors
      VECTOR_BUCKET_NAME: team04-hotel-chatbot-vectors
      VECTOR_INDEX_NAME: hotel-docs
      AWS_REGION: us-east-1
  # prod 는 결제 VPC 의 결제 서버(클러스터 밖)가 운영 → 클러스터에는 배포하지 않음. 이미지 태그는 envs/prod/payment
  payment-service:
    enabled: false
  # prod 는 실제 PG(토스)를 결제 서버가 직접 호출 → 목업 불필요
  pg-mock-service:
    enabled: false
migrations:
  # 메인 DB(RDS, 41-main-data) — 배포 직전 hook 으로 Flyway 적용. RDS 서버 인증서를 검증하는 TLS 로 접속
  # Flyway 이미지의 드라이버는 MariaDB Connector/J 2.x 라 3.x 옵션 sslMode 는 무시되고 평문으로 붙는다.
  # 2.x 는 useSsl + serverSslCert 이고 호스트 이름 검증은 기본으로 켜져 있다
  main:
    enabled: true
    db:
      jdbcParams: "useSsl=true&serverSslCert=/flyway/certs/us-east-1-bundle.pem"
      caConfigMap: rds-ca-bundle # backend-secrets 앱
  # 결제 DB 는 결제 서버 쪽에서 적용 (클러스터에서 결제 DB 에 접근하지 않음)
  payment:
    enabled: false
# 챗봇 오케스트레이션 워크플로. 이미지는 Docker Hub n8nio/n8n 을 release.yml 이 ECR 로 옮긴 것 (amd64, 태그 = 차트 n8n.image.tag)
# owner 비밀번호(워크플로 활성화용 내부 계정)는 backend-secrets 의 N8N_INIT_OWNER_PASSWORD (41-main-data, 매일 새 값)
n8n:
  enabled: true
# GCP Workload Identity Federation (Terraform 14-gcp-llm 🔒 output, 모두 공개 값 — 키 없음)
#   llm-service · llm-ingest 파드 projected 토큰 → STS → llm-service-prod impersonate → Vertex AI
gcpWorkloadIdentity:
  enabled: true
  audience: "//iam.googleapis.com/projects/1066485667715/locations/global/workloadIdentityPools/team04-hotel-prod/providers/main-cluster"
  serviceAccountEmail: llm-service-prod@likelion-devops-7th-3rd-team4.iam.gserviceaccount.com
# RAG 문서 적재 Job — 릴리스마다 llm-service 이미지의 문서(app/corpus.py)를 임베딩해 15-chatbot-vectors 인덱스에 넣는다.
# 문서 id 가 key 라 중복되지 않는다. 자격 증명은 IRSA(team04-hotel-llm-ingest, 쓰기만) + GCP Workload Identity
llmIngest:
  enabled: true
# 초기 데이터 시딩 Job (LDP-141) — 메인 DB 를 매일 새로 만들므로 배포마다 호텔 · 객실 · 재고 · 관리자 계정 · 객실 사진을 채운다.
# 마이그레이션 hook 뒤에 실행되는 일반 Job 이라 실패해도 서비스 배포는 롤백되지 않는다. 이미지 태그는 global.imageTag 와 같음
seed:
  enabled: true
  env:
    # 객실 사진 버킷 (13-frontend, 매일 재생성되지 않음). 고정 키 room-types/<객실 종류 ID>/seed-<파일>, 이미 있으면 올리지 않음
    # 엔드포인트 · 키를 비우면 AWS 기본 주소 + IRSA(team04-hotel-seed, room-types/* PutObject 만)
    S3_BUCKET: team04-hotel-room-images
    S3_REGION: us-east-1
    # 시딩 후 hotel-service 조회 캐시 비우기 (REDIS_HOST · REDIS_PASSWORD 는 차트 기본 secretEnv). ElastiCache 전송 암호화 required
    REDIS_TLS: "true"
  # 관리자 계정 Secret (backend-secrets 앱의 ExternalSecret ← Secrets Manager team04-hotel/prod/seed-admin, Terraform 12-secrets)
  adminSecretName: seed-admin
  db:
    # RDS 서버 인증서 · 호스트 이름 검증 TLS (require_secure_transport 를 켜도 접속됨)
    caConfigMap: rds-ca-bundle # backend-secrets 앱
