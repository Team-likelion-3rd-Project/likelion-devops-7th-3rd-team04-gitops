# auth 를 비워 ESO 컨트롤러의 기본 자격 증명(pod-identity-webhook 이 주입한 IRSA 웹 ID 토큰)을 쓴다.
# 읽을 수 있는 Secret 은 IAM Role 정책(Terraform 70 irsa.tf) 과 Secret 리소스 정책(41-main-data)이 제한한다
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: {{ .Values.name }}
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  provider:
    aws:
      service: SecretsManager
      region: {{ .Values.region | quote }}
