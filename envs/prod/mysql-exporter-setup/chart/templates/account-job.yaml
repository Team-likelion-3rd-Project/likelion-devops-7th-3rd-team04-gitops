{{- /*
exporter 계정 생성 · 갱신 (스크립트 files/account.sh, 재실행 안전 — 41 이 매일 새 비밀번호를 만든다).
ArgoCD Sync hook 이라 이 앱이 sync 할 때 실행된다: 클러스터 첫 sync(매일 재생성), 일반 리소스가 바뀐 커밋, 수동 sync.
hook 은 비교 대상이 아니어서 이 파일만 바뀌면 sync 되지 않는다 → 스크립트 · 설정과 이 Job spec 의 checksum 을
일반 리소스 ConfigMap(account-script.yaml)에 두어 변경 시 다시 실행되게 한다.
실패하면 root 의 sync 재시도가 Job 을 새로 만들어 다시 시도한다 (BeforeHookCreation).
wave 1 — 같은 sync 의 ExternalSecret · ConfigMap(wave 0)이 Healthy 가 된 뒤 실행된다.
*/ -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: mysql-exporter-account
  labels:
    app.kubernetes.io/name: mysql-exporter-account
    app.kubernetes.io/managed-by: {{ .Release.Service }}
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/sync-wave: "1"
    # 다음 sync 직전에 지운다 — 마지막 실행 로그를 남겨 둔다
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: {{ .Values.job.backoffLimit }}
  activeDeadlineSeconds: {{ .Values.job.activeDeadlineSeconds }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mysql-exporter-account
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999   # 이미지의 mysql 사용자
        runAsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: account
          image: {{ .Values.job.image | quote }}
          envFrom:
            - secretRef:
                name: {{ .Values.setupSecretName }}
            # MAX_USER_CONNECTIONS · CA_FILE
            - configMapRef:
                name: {{ .Values.accountScriptConfigMap }}
          command: ["/bin/bash", "/scripts/account.sh"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          volumeMounts:
            - name: work
              mountPath: /work
            - name: rds-ca
              mountPath: {{ .Values.rdsCaMountPath }}
              readOnly: true
            - name: script
              mountPath: /scripts
              readOnly: true
      volumes:
        - name: work
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
        - name: rds-ca
          configMap:
            name: {{ .Values.rdsCaConfigMap }}
        - name: script
          configMap:
            name: {{ .Values.accountScriptConfigMap }}
