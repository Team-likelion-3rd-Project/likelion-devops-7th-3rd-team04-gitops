{{- /*
exporter 계정 생성 · 갱신. ArgoCD Sync hook 이라 이 앱을 sync 할 때마다(= gitops 커밋마다) 다시 실행된다.
재실행 안전: CREATE USER IF NOT EXISTS 뒤 ALTER USER 로 비밀번호 · 제한을 매번 다시 넣는다 (41 이 매일 새 비밀번호를 만든다).
wave 1 — 같은 sync 의 ExternalSecret(wave 0)이 Healthy(Secret 생성)가 된 뒤 실행된다.
권한: PROCESS(processlist · InnoDB 상태) · REPLICATION CLIENT(MariaDB 의 BINLOG MONITOR 별칭, 복제 상태) · performance_schema 읽기.
performance_schema 는 db.t4g.micro 라 꺼져 있고 exporter 수집기도 끈다 — 나중에 켤 때 권한을 다시 줄 필요가 없게 미리 준다.
비밀번호는 명령 인자(ps 에 보임)가 아니라 메모리 emptyDir 의 옵션 파일 · stdin 으로 넘긴다 (Secrets Manager 비밀번호는 영숫자만).
*/ -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: mysql-exporter-account
  labels:
    app.kubernetes.io/name: mysql-exporter-account
    app.kubernetes.io/managed-by: {{ .Release.Service }}
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/sync-wave: "1"
    # 다음 sync 직전에 지운다 — 마지막 실행 로그를 남겨 둔다
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: {{ .Values.job.backoffLimit }}
  activeDeadlineSeconds: {{ .Values.job.activeDeadlineSeconds }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mysql-exporter-account
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999   # 이미지의 mysql 사용자
        runAsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: account
          image: {{ .Values.job.image | quote }}
          envFrom:
            - secretRef:
                name: {{ .Values.setupSecretName }}
          env:
            - name: MAX_USER_CONNECTIONS
              value: {{ .Values.maxUserConnections | quote }}
            - name: CA_FILE
              value: {{ printf "%s/%s" .Values.rdsCaMountPath .Values.rdsCaFile | quote }}
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -euo pipefail
              umask 077
              cat > /work/master.cnf <<CNF
              [client]
              host=${MASTER_HOST}
              port=${MASTER_PORT}
              user=${MASTER_USER}
              password=${MASTER_PASSWORD}
              ssl-ca=${CA_FILE}
              ssl-verify-server-cert
              CNF
              # 'exporter'@'%' — 파드는 워커 노드 IP 로 나가므로(Calico natOutgoing) 호스트를 고정할 수 없다. 접속은 SG M11 이 워커로 제한
              mariadb --defaults-extra-file=/work/master.cnf <<SQL
              CREATE USER IF NOT EXISTS '${EXPORTER_USER}'@'%' IDENTIFIED BY '${EXPORTER_PASSWORD}';
              ALTER USER '${EXPORTER_USER}'@'%' IDENTIFIED BY '${EXPORTER_PASSWORD}' REQUIRE SSL WITH MAX_USER_CONNECTIONS ${MAX_USER_CONNECTIONS};
              GRANT PROCESS, REPLICATION CLIENT ON *.* TO '${EXPORTER_USER}'@'%';
              GRANT SELECT ON performance_schema.* TO '${EXPORTER_USER}'@'%';
              SQL
              # 알람 임계값 · 커넥션 풀 크기 근거 (Terraform 90 db_connections_threshold)
              mariadb --defaults-extra-file=/work/master.cnf --table <<SQL
              SELECT @@max_connections AS max_connections, @@performance_schema AS performance_schema,
                     @@log_output AS log_output, @@log_slow_query AS log_slow_query, @@log_slow_query_time AS log_slow_query_time;
              SHOW GLOBAL STATUS WHERE Variable_name IN ('Threads_connected', 'Max_used_connections');
              -- SHOW GRANTS 는 비밀번호 해시를 출력하므로 쓰지 않는다
              SELECT PRIVILEGE_TYPE FROM information_schema.USER_PRIVILEGES WHERE GRANTEE = "'${EXPORTER_USER}'@'%'";
              SQL
              echo "exporter 계정 준비 완료"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          volumeMounts:
            - name: work
              mountPath: /work
            - name: rds-ca
              mountPath: {{ .Values.rdsCaMountPath }}
              readOnly: true
      volumes:
        - name: work
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
        - name: rds-ca
          configMap:
            name: {{ .Values.rdsCaConfigMap }}
