# 계정 생성 Job 용 — master(계정을 만드는 쪽)와 exporter 계정 이름 · 비밀번호
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.setupSecretName }}
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  refreshInterval: {{ .Values.refreshInterval }}
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ .Values.clusterSecretStore }}
  target:
    name: {{ .Values.setupSecretName }}
    creationPolicy: Owner
  data:
    {{- range $key, $property := dict "MASTER_HOST" "host" "MASTER_PORT" "port" "MASTER_USER" "username" "MASTER_PASSWORD" "password" }}
    - secretKey: {{ $key }}
      remoteRef:
        key: {{ $.Values.remoteKeys.master }}
        property: {{ $property }}
    {{- end }}
    {{- range $key, $property := dict "EXPORTER_USER" "username" "EXPORTER_PASSWORD" "password" }}
    - secretKey: {{ $key }}
      remoteRef:
        key: {{ $.Values.remoteKeys.exporter }}
        property: {{ $property }}
    {{- end }}
---
# exporter 용 my.cnf (mysqld_exporter --config.my-cnf). ssl-ca 가 있으면 exporter 는 CA · 호스트 이름을 검증하는 TLS 로 접속한다.
# 아래 {{ "{{ .host }}" }} 등은 ESO 템플릿 (Helm 이 아니라 ESO 가 Secrets Manager 값으로 채움)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.configSecretName }}
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  refreshInterval: {{ .Values.refreshInterval }}
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ .Values.clusterSecretStore }}
  target:
    name: {{ .Values.configSecretName }}
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        {{ .Values.configSecretKey }}: |
          [client]
          host={{ "{{ .host }}" }}
          port={{ "{{ .port }}" }}
          user={{ "{{ .username }}" }}
          password={{ "{{ .password }}" }}
          ssl-ca={{ .Values.rdsCaMountPath }}/{{ .Values.rdsCaFile }}
          tls-min-version=TLSv1.2
  data:
    {{- range list "host" "port" "username" "password" }}
    - secretKey: {{ . }}
      remoteRef:
        key: {{ $.Values.remoteKeys.exporter }}
        property: {{ . }}
    {{- end }}
