# mysql-exporter 앱의 준비물 (LDP-180) — 메인 RDS exporter 계정 생성 Job, exporter my.cnf Secret(ExternalSecret), RDS CA ConfigMap.
# 계정 비밀번호는 Terraform 41-main-data 가 매일 새로 만든다 (Secrets Manager team04-hotel/prod/main-db-exporter).
# 토글: mysql-exporter 앱과 같이 켜고 끈다 (둘 다 enabled: false 가 기본)
type: local
path: chart   # 이 폴더 기준
namespace: monitoring
release: mysql-exporter-setup
enabled: true   # 검증용 (PR 에서는 false)
# kube-prometheus-stack(60) 다음 — 계정 생성 Job 이 실패해도 관측 스택은 먼저 뜬다. mysql-exporter(65) 보다 먼저
order: 62
